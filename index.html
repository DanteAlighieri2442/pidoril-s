<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Градієнти</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background-color: #0e0b44;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
        max-width: 1200px;
        margin: 0 auto;
      }

      /*grid робить таку собі уявну сітку, по якій потім розміщуются блоки*/

      .block {
        min-height: 180px;
        border-radius: 4px;
      }

      /*block робить ці блоки певного розміру, а border робить скругленні кути */

      .block:hover {
        transform: scale(1.05);
        transition: transform 0.3s ease;
      }

      /*категорично не обовьязкова штука, при наведенні курсора на блок він збільшується, за те виглядяє приємно */

      .one { background: linear-gradient(to right, #ff512f, #dd2476); }
      .two { background: linear-gradient(135deg, #00e5ff 0%, #005bea 100%); }
      .three { background: linear-gradient(to bottom, #ff0000 0%, #ff9900 50%, #ffff00 100%); }
      .four { background: linear-gradient(45deg, #11998e, #38ef7d); }
      .five { background: linear-gradient(to left, #654ea3, #eaafc8); }
      .six { background: radial-gradient(circle, #ffffff 0%, #ff0000 35%, #660000 100%); }
      .seven { background: radial-gradient(circle at top left, #00ff00 0%, #00a000 35%, #001f00 100%); }
      .eight { background: radial-gradient(ellipse, #00c6ff, #0072ff); }
      .nine { background: conic-gradient(red, blue); }
      .ten { background: conic-gradient(at 0% 30%, red 10%, yellow 30%, #1e90ff 50%); }
      .eleven { background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); }
      .twelve { background: conic-gradient(from 90deg, #0000ff 0deg, #00ffff 120deg, #00ff00 240deg, #0000ff 360deg); }
      .thirteen { background: conic-gradient(at 30% 30%, #2193b0, #6dd5ed, #2193b0); }
      .fourteen { background: conic-gradient(from 180deg at 70% 60%, #f953c6, #b91d73, #f953c6); }
      .fifteen { background: repeating-linear-gradient(45deg, #222222 0 10px, #555555 10px 20px); }
      .sixteen { background: repeating-linear-gradient(to right, #ff0000 0 15px, #ffff00 15px 30px); }
      .seventeen { background: repeating-linear-gradient(to bottom, #0000ff 0 12px, #00ffff 12px 24px); }
      .eighteen { background: repeating-radial-gradient(circle, #2c3e50 0 10px, #3498db 10px 20px); }
      .nineteen { background: repeating-radial-gradient(ellipse at center, #ffff00 0 12px, #ff0000 12px 24px); }
      .twenty { background: repeating-conic-gradient(#000000 0 15deg, #ffffff 15deg 30deg); }
      .twentyone {
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.35) 0 12%, transparent 12% 48%, rgba(255, 190, 80, 0.3) 48% 62%, transparent 62%),
          conic-gradient(from 210deg at 25% 30%, #ffb347, #ff416c, #8e2de2, #ffb347),
          radial-gradient(circle at 80% 75%, rgba(255, 255, 255, 0.4), transparent 30%),
          linear-gradient(135deg, #ff512f, #dd2476);
      }
      .twentytwo {
        background:
          linear-gradient(60deg, transparent 0 30%, rgba(255, 255, 255, 0.3) 30% 38%, transparent 38%),
